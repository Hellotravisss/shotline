[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotline"
version = "0.1.0"
description = "App Store screenshots as a pipeline: capture, compose, check, ship, verify."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
shotline = "shotline.__main__:main"

[tool.setuptools]
packages = ["shotline"]

[tool.setuptools.package-data]
shotline = ["templates/*.html"]
